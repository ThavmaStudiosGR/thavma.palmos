name: Thavma Palmos - Handover Guard V6

on:
  workflow_run:
    workflows: ['Thavma Palmos - 24/7 Live Radio V6']
    types: [completed]

permissions:
  contents: read
  actions: write

jobs:
  ensure-successor:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure another broadcaster exists
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.event.workflow_run.head_branch || github.event.repository.default_branch }}
          FINISHED_RUN: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          sleep 20
          active=$(gh api "repos/$REPO/actions/workflows/live.yml/runs?status=in_progress&per_page=50" --jq '.total_count')
          queued=$(gh api "repos/$REPO/actions/workflows/live.yml/runs?status=queued&per_page=50" --jq '.total_count')
          waiting=$(gh api "repos/$REPO/actions/workflows/live.yml/runs?status=waiting&per_page=50" --jq '.total_count' 2>/dev/null || echo 0)
          echo "live.yml active=$active queued=$queued waiting=$waiting"
          if [ $((active + queued + waiting)) -eq 0 ]; then
            echo "No successor found. Dispatching live.yml now."
            gh workflow run live.yml --repo "$REPO" --ref "$REF" \
              -f test_newyear=false \
              -f handover_from="$FINISHED_RUN" \
              -f handover_reason=workflow_run_guard
          else
            echo "Successor already exists. Nothing to do."
          fi
