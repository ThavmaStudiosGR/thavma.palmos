name: Thavma Palmos - 24/7 Live Radio (Seamless Overlap)

on:
  schedule:
    # Νέο job κάθε 4 ώρες. ΠΡΟΣΟΧΗ: το GitHub Actions cron δουλεύει σε UTC, όχι ώρα
    # Ελλάδας — αυτό δεν πειράζει τη λογική του overlap (είναι σχετική, όχι απόλυτη),
    # απλά να το ξέρεις αν ψάχνεις τις ώρες εκκίνησης στα logs.
    - cron: '0 */4 * * *'
  workflow_dispatch: {} # Επιτρέπει και χειροκίνητη εκκίνηση από το GitHub UI

# ΣΚΟΠΙΜΑ δεν ορίζουμε 'concurrency' εδώ. Το GitHub Actions επιτρέπει από προεπιλογή
# πολλαπλά ταυτόχρονα runs του ίδιου workflow. Αν προσθέσεις concurrency group με το
# ίδιο όνομα σε όλα τα runs, το νέο job θα ΣΚΟΤΩΝΕΙ το παλιό αμέσως — αντίθετο από
# αυτό που θέλουμε (30 λεπτά παράλληλης λειτουργίας).
jobs:
  stream:
    runs-on: ubuntu-latest
    # Το ίδιο το GitHub Actions job timeout. Το βάζουμε λίγο πιο πάνω από το εσωτερικό
    # timeout του 4.5ώρου (270') ώστε ο εσωτερικός χρονομετρητής να προλάβει να κλείσει
    # πρώτος καθαρά, πριν αναγκαστικά το σκοτώσει το GitHub.
    timeout-minutes: 280

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Verify ffmpeg is available
        run: |
          if ! command -v ffmpeg &> /dev/null; then
            sudo apt-get update -y
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: Install custom fonts (Century / Century Gothic renamed files, αν υπάρχουν στο repo)
        run: |
          mkdir -p /usr/share/fonts/truetype/custom
          if [ -d "./fonts" ]; then
            sudo cp ./fonts/*.ttf /usr/share/fonts/truetype/custom/ 2>/dev/null || true
            sudo fc-cache -f -v /usr/share/fonts/truetype/custom/
            echo "Custom fonts installed:"
            ls -la /usr/share/fonts/truetype/custom/
          else
            echo "Δεν βρέθηκε φάκελος ./fonts στο repo — θα χρησιμοποιηθεί η εφεδρική γραμματοσειρά (DejaVu)."
          fi

      - name: Run 24/7 radio stream (auto-exits cleanly after 4.5 hours)
        env:
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: |
          # Ο 'timeout' στέλνει SIGTERM στο node process ακριβώς στα 16200 δευτ. (4.5 ώρες).
          # Το index.js πιάνει το SIGTERM (gracefulShutdown) και κλείνει καθαρά το ffmpeg.
          # Το '|| true' εξασφαλίζει ότι το step ΔΕΝ θα σημειωθεί ως αποτυχημένο (failed)
          # απλά επειδή ο node τερματίστηκε λόγω του timeout — αυτό είναι αναμενόμενο και
          # φυσιολογικό, όχι σφάλμα.
          timeout 16200 node index.js || true
