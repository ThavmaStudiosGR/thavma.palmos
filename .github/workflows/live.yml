name: Thavma Palmos - 24/7 Live Radio V6

on:
  workflow_dispatch:
    inputs:
      test_newyear:
        description: 'One-time TEST Πρωτοχρονιάς'
        required: false
        type: boolean
        default: false
      handover_from:
        description: 'Previous broadcaster run id'
        required: false
        type: string
        default: ''
      handover_reason:
        description: 'Reason for automatic handover'
        required: false
        type: string
        default: 'manual'

permissions:
  contents: read
  actions: write

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 245

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund express @supabase/supabase-js nodemailer

      - name: Verify ffmpeg / ffprobe
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Ensure fallback fonts
        run: |
          if [ ! -f /usr/share/fonts/truetype/liberation/LiberationSans-Regular.ttf ]; then
            sudo apt-get update -y
            sudo apt-get install -y fonts-liberation
          fi
          mkdir -p /usr/share/fonts/truetype/custom
          if [ -d "./fonts" ]; then
            sudo cp ./fonts/*.ttf /usr/share/fonts/truetype/custom/ 2>/dev/null || true
            sudo fc-cache -f >/dev/null 2>&1 || true
          fi

      - name: Run broadcaster V6
        env:
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          TEST_NEWYEAR: ${{ inputs.test_newyear }}
          CROSSFADE_SECONDS: '3'
          AD_EVERY_SONGS: '7'
          DAY_BG_START_HOUR: '7'
          NIGHT_BG_START_HOUR: '20'
          SELF_HANDOVER_AFTER_MINUTES: '215'
          STREAM_OWNER_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          GITHUB_TOKEN_FOR_HANDOVER: ${{ github.token }}
          GITHUB_REPOSITORY_NAME: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          echo "Starting V6 broadcaster. Previous=${{ inputs.handover_from }} Reason=${{ inputs.handover_reason }}"
          timeout --signal=TERM --kill-after=15s 13800 node index.js || code=$?
          echo "Broadcaster process ended with code ${code:-0}. Handover workflow/watchdog will verify a successor."
