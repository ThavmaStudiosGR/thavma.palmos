name: Thavma Palmos - 24/7 Live Radio (Seamless Overlap)

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch: {}

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 280

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --omit=dev

      - name: Verify ffmpeg is available
        run: |
          if ! command -v ffmpeg &> /dev/null; then
            sudo apt-get update -y
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: Install custom fonts
        run: |
          mkdir -p /usr/share/fonts/truetype/custom
          if [ -d "./fonts" ]; then
            sudo cp ./fonts/*.ttf /usr/share/fonts/truetype/custom/ 2>/dev/null || true
            sudo fc-cache -f -v /usr/share/fonts/truetype/custom/
            echo "Custom fonts installed:"
            ls -la /usr/share/fonts/truetype/custom/
          else
            echo "No fonts folder found - using default fonts"
          fi

      - name: Run 24/7 radio stream
        env:
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: timeout 16200 node index.js || true
